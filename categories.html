    padding: 5px;

<body onload="clickFestival()" >
    <nav>

       <button style="float: inline-start;"><a href="images.html">click to see ALL DESIGN</a></button>
       <br>
       <br>
       
    
</body>
<script>
function clickFestival(){

   

    fetch('https://mehndi-api.trendoradigital.com/api/categories', {
        method: "GET",
        headers: {
            'Content-Type': 'application/json'
        }
    })
    .then(response => response.json())
    .then(data => {

        data.forEach(element => {
             const newdiv = document.createElement('div');
                newdiv.innerHTML = `<h2>${element.name}</h2><img src="${element.image}" alt="${element.name}">`;


    document.body.appendChild(newdiv);
             
            
        });
        console.log(data.name);

       

    })
    .catch(err => {
        console.error('Error:', err);
    });

}

</script>
