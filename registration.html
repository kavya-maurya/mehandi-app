<input type="text" id="name" placeholder="full name                                                            👤" ></input>
<br>
<br>
      
        <input type="email" placeholder="email                                                                  📧" id="email"></input>

<br>
<br>

<br>
<br>

        <input type="submit" value="register" onclick="submit()">

<script>

        
		
		function submit(){
			const name=document.getElementById('name').value;
		const email=document.getElementById('email').value;
		const password=document.getElementById('password').value;
		const pn=document.getElementById('pn').value;
			 
			const user={
				name: name,
    mobile: pn,
    email: email,
    password: password
			}
console.log(user);
			fetch('https://wallmagin-1.onrender.com/auth/register',{
				method:'POST',
				headers:{
					'Content-Type':'application/json'
				},
				body:JSON.stringify(user)
			}).then(response=>response.json)
        .then(data=>{
            console.log(data);
             alert("your form has been submitted");
        }).catch(err=>{
            console.error('Error:', err);
        })
		
	//to redirect to askai page after registration
		setTimeout(function(){
			window.location.href = "index.html";		
		}

		,2000);
	}
	
		

    </script>
